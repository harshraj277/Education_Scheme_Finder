<!DOCTYPE html>
<html lang="en" data-theme="light" data-textsize="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Application dates — Yojana Setu</title>
<meta name="description" content="Why this page does not show application deadlines, and where to find the real ones.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230F2A52'/><path d='M4 18h16M6.5 18V9.5M17.5 18V9.5M6.5 9.5c3.2-3.3 7.8-3.3 11 0' stroke='%23C9A227' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">

<script>
  (function () {
    try {
      var th = JSON.parse(localStorage.getItem("ys.theme") || '"auto"');
      document.documentElement.setAttribute("data-theme",
        (th === "dark" || (th === "auto" && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light");
      if (JSON.parse(localStorage.getItem("ys.lang") || '"en"') === "hi")
        document.documentElement.setAttribute("lang", "hi");
      var p = JSON.parse(localStorage.getItem("ys.prefs") || "null");
      if (p) {
        if (p.textSize) document.documentElement.setAttribute("data-textsize", p.textSize);
        if (p.contrast) document.documentElement.setAttribute("data-contrast", "high");
      }
    } catch (e) {}
  })();
</script>
</head>

<body>
  <div data-header></div>

  <main id="main" tabindex="-1" class="page">
    <div class="wrap wrap-narrow">
      <div class="page-head">
        <p class="eyebrow" data-i18n="dl.eyebrow">Deadlines</p>
        <h1 data-i18n="dl.h1">Application dates</h1>
        <p data-i18n="dl.sub"></p>
      </div>

      <div id="calRoot" aria-live="polite" aria-busy="true" style="margin-top: var(--sp-8)"></div>
    </div>
  </main>

  <div data-footer></div>
  <nav class="bottomnav" data-bottomnav></nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/deadlines.js"></script>
</body>
</html>
