<!DOCTYPE html>
<html lang="en" data-theme="light" data-textsize="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Explore education schemes — Yojana Setu</title>
<meta name="description" content="Filter 24 central government education schemes by level, benefit type, income ceiling and beneficiary category.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">

<script>
  (function () {
    try {
      var th = JSON.parse(localStorage.getItem("ys.theme") || '"auto"');
      document.documentElement.setAttribute("data-theme",
        (th === "dark" || (th === "auto" && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light");
      if (JSON.parse(localStorage.getItem("ys.lang") || '"en"') === "hi")
        document.documentElement.setAttribute("lang", "hi");
      var p = JSON.parse(localStorage.getItem("ys.prefs") || "null");
      if (p) {
        if (p.textSize) document.documentElement.setAttribute("data-textsize", p.textSize);
        if (p.contrast) document.documentElement.setAttribute("data-contrast", "high");
      }
    } catch (e) {}
  })();
</script>
</head>

<body>
  <div data-header></div>

  <main id="main" tabindex="-1" class="page">
    <div class="wrap">

      <div class="page-head">
        <p class="eyebrow" data-i18n="explore.eyebrow">Explore</p>
        <h1 data-i18n="explore.h1">Find government education schemes</h1>
        <p data-i18n="explore.sub"></p>
      </div>

      <div class="search-row mb-6">
        <div id="exploreSearch" class="search-row__bar"></div>
        <button type="button" class="btn btn-secondary filter-toggle" id="filterOpen"
                aria-controls="filters" aria-expanded="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="filter-toggle__icon">
            <path d="M4 6h16M4 12h16M4 18h16"/>
            <circle cx="9" cy="6" r="2" fill="var(--surface)"/>
            <circle cx="15" cy="12" r="2" fill="var(--surface)"/>
            <circle cx="8" cy="18" r="2" fill="var(--surface)"/>
          </svg>
          <span data-i18n="explore.filters">Filters</span>
          <span class="count-pill" id="filterCountMobile" style="display:none">0</span>
          <span class="filter-toggle__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </span>
        </button>
      </div>

      <div class="explorer">

        <!-- ============ FILTER SIDEBAR / BOTTOM SHEET ============ -->
        <aside class="filters" id="filters" aria-label="Filters">
          <div class="filters__head">
            <h2 data-i18n="explore.filters">Filters</h2>
            <button type="button" class="btn btn-ghost btn-sm" id="clearAllBtn"
                    data-i18n="btn.clear">Clear all</button>
          </div>

          <div id="filterBody"></div>

          <div class="filters__foot">
            <button type="button" class="btn btn-secondary" id="clearAllBtn2"
                    data-i18n="btn.clearFilters">Clear</button>
            <button type="button" class="btn btn-primary btn--apply" id="applyBtn"
                    data-i18n="btn.apply">Apply Filters</button>
          </div>
        </aside>
        <div class="scrim" id="filterScrim"></div>

        <!-- ============ RESULTS ============ -->
        <section>
          <div class="results-head">
            <p class="results-count" id="resultCount" role="status" aria-live="polite"></p>
            <div class="row g-3">
              <label class="sr-only" for="sortSel" data-i18n="explore.sort">Sort</label>
              <select class="select" id="sortSel"></select>
            </div>
          </div>

          <div class="active-filters" id="activeFilters"></div>
          <div id="diagBanner"></div>

          <div id="results" aria-live="polite" aria-busy="true"></div>
        </section>

      </div>
    </div>
  </main>

  <div data-footer></div>
  <nav class="bottomnav" data-bottomnav></nav>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/explore.js"></script>
</body>
</html>
